name: Deploy nac-spec to yujin.app/nac-spec/

# Mirror this repo's contents into the GoDaddy public_html path that
# serves https://yujin.app/nac-spec/. The mirror previously lived
# inside the rpaforce repo (rpaforce/yujin.app/nac-spec/) and was
# removed in rpaforce commit 0ff3afa0 ("canonical lives at
# yujinapp/nac-spec"). This workflow re-establishes the deploy path
# without a duplicate copy in rpaforce.
#
# Secrets needed in this repo (Settings -> Secrets and variables ->
# Actions). Copy them from the rpaforce-crm repo secrets where the
# same values already live:
#   GODADDY_HOST     -- e.g. p3plzcpnl504099.prod.phx3.secureserver.net
#   GODADDY_USER     -- e.g. c5kfcjz0z5se
#   GODADDY_SSH_KEY  -- the full private key (PEM), no passphrase
#
# Trigger:
#   - every push to main
#   - manual via "Run workflow" on the Actions tab
#
# Implementation note: the GoDaddy cPanel shell init scripts call
# `tput` which fails on non-interactive SSH sessions when $TERM is
# empty. The default appleboy/scp-action runs an extract step that
# inherits this broken state and rolls back. We use direct rsync
# over SSH (with the runner's openssh client) and explicitly
# override TERM so the remote shell init does not blow up.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Rsync to GoDaddy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrity gate
        # Audit N-02/N-03. A stale Subresource Integrity hash in index.html
        # must block the deploy instead of shipping a page that silently
        # refuses to run, or that tells adopters to load an unverified file.
        # Byte-level, no browser, no dependencies.
        run: node scripts/build-integrity.mjs

      - name: Integrity gate goes red when it should
        # The integrity gate shipped with zero behaviour tests, and four
        # defects were found in it by hand once someone looked: --write
        # alone refreshed an already-published frozen copy; a refused
        # freeze still rewrote index.html, leaving a hash that matched
        # nothing; the "loads from the immutable path" assertion was
        # satisfied by the prose two sections above, so the tag could
        # revert to the mutable alias (audit N-03) and still pass; and
        # the adopter-snippet check read the tag --write had just
        # re-pinned, so it could not see a stale snippet.
        # Same shape as the contract suite: one thing broken per case,
        # in a throwaway git repo, asserting the right refusal.
        run: node scripts/test-integrity-gate.mjs

      - name: Version coherence gate
        # Audit N-17. The published tarball once announced a version two
        # releases behind its own package.json, because the version was
        # hand-typed in a dozen files and whoever published remembered
        # eleven. This refuses a tree where any declared slot disagrees
        # with the authoritative constant in js/nac.js.
        run: node scripts/check-version-coherence.mjs

      - name: Contract API gate
        # Audit N-04 / N-14, owner decision D-02. The contract is
        # published as static JSON under api/, one frozen directory per
        # version. This regenerates it from the runtime and refuses the
        # deploy when: the artefacts drifted from the runtime that
        # produced them, a published version was rewritten, a version
        # disappeared from the tree (the rsync below mirrors with
        # --delete-after, so that would delete it from the web), or the
        # hash chain does not recompute.
        run: node scripts/build-contract-api.mjs

      - name: Contract API gate goes red when it should
        # A gate nobody proved red is a decoration. This suite breaks
        # one thing at a time in a throwaway copy and asserts the gate
        # refuses each one for the right reason. Includes the signature
        # cases: a tampered signature, a stale one, a substituted key,
        # a retired key, a published key with no signature at all, and
        # the two ways the owner could lose control of the private key.
        run: node scripts/test-contract-api.mjs

      - name: Consumer verifier goes red when it should
        # The other half, and the half that matters to anyone who is
        # not us: the command a third party runs against a URL. Each
        # case stands up a real HTTP server over a copy of api/, serves
        # a tampered publication, and asserts the verifier refuses.
        #
        # The case worth naming: a host that rewrites an artefact,
        # rebuilds the whole chain so it recomputes, publishes a key of
        # its own and signs the forgery with it. Everything closes
        # against itself; only the independent witnesses catch it. All
        # localhost, no network.
        run: node scripts/test-contract-api-http.mjs

      - name: Stage files for upload
        # Strip junk that should never land on the live server.
        run: |
          rm -rf _deploy_stage
          mkdir -p _deploy_stage
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='node_modules/' \
            --exclude='_deploy_stage/' \
            --exclude='*.tsbuildinfo' \
            --exclude='*.log' \
            --exclude='IMPLEMENTATION_GUIDE.md' \
            --exclude='NPM_PUBLISH_RUNBOOK.md' \
            --exclude='PERFORMANCE_TEST_PLAN.md' \
            --exclude='PROJECT.md' \
            --exclude='PROMO_WEEK_*.md' \
            --exclude='PENDING_*.md' \
            ./ _deploy_stage/
          echo "Staged $(find _deploy_stage -type f | wc -l) files / $(du -sh _deploy_stage | cut -f1)"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GODADDY_SSH_KEY }}" > ~/.ssh/godaddy_key
          chmod 600 ~/.ssh/godaddy_key
          ssh-keyscan -t ed25519,rsa,ecdsa -H "${{ secrets.GODADDY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to GoDaddy
        # Direct rsync over SSH with an explicit TERM=dumb so the
        # remote cPanel shell init's tput call does not abort the
        # connection. -e configures the SSH command rsync invokes
        # under the hood.
        env:
          TERM: dumb
        run: |
          rsync -avz --delete-after \
            --no-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/godaddy_key -p 22 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o SendEnv=TERM" \
            _deploy_stage/ \
            "${{ secrets.GODADDY_USER }}@${{ secrets.GODADDY_HOST }}:/home/${{ secrets.GODADDY_USER }}/public_html/yujin.app/nac-spec/" \
            2>&1 | tail -40

      - name: Smoke check the live site
        run: |
          for i in 1 2 3; do
            BODY="$(curl -fsSL --max-time 20 https://yujin.app/nac-spec/ || true)"
            if echo "$BODY" | grep -q "Native Agent Contract"; then
              echo "Live site responding with expected content."
              # Bonus: confirm the Now-in-alpha section landed too.
              if echo "$BODY" | grep -q "Now in alpha"; then
                echo "Updated Forge commercial section is live."
              else
                echo "::warning::Live site responding but 'Now in alpha' section not yet visible (may be CDN cache)."
              fi
              exit 0
            fi
            echo "Attempt $i did not see expected content, retrying..."
            sleep 5
          done
          echo "::error::Smoke check failed -- yujin.app/nac-spec/ did not return expected content within 3 tries"
          exit 1

      - name: Smoke check integrity is live
        # The audit measures these from outside; so does this.
        #
        # The versioned path is READ from js/integrity.json, not typed
        # here. It used to be hard-coded twice, which meant the next
        # version bump would have failed this step on a deploy that was
        # otherwise perfectly correct -- the workflow would have been
        # asserting the presence of the PREVIOUS release. Audit N-17.
        run: |
          IMMUTABLE="$(node -e "process.stdout.write(require('./js/integrity.json').immutable_path)")"
          echo "Immutable path under test: $IMMUTABLE"
          BODY="$(curl -fsSL --max-time 20 https://yujin.app/nac-spec/)"
          grep -q 'integrity="sha384-' <<< "$BODY" || { echo "::error::Landing page went live without an SRI hash"; exit 1; }
          grep -qF "$IMMUTABLE" <<< "$BODY" || { echo "::error::Landing page does not offer the immutable versioned path ($IMMUTABLE)"; exit 1; }
          curl -fsSL --max-time 20 -o /dev/null -w '%{http_code}\n' "https://yujin.app/nac-spec/$IMMUTABLE" | grep -qx 200 || { echo "::error::Immutable runtime path is not being served ($IMMUTABLE)"; exit 1; }
          echo "Integrity is live."

      - name: Verify the published contract API from outside
        # The producer checked itself before the upload; this checks the
        # HOST. It fetches the published chain, recomputes it, compares
        # the sha384 of the bytes the server actually sent against the
        # recorded hashes, and requires the CORS header without which a
        # browser agent cannot read any of it.
        #
        # --expect-head-from-repo is the part that matters: the head is
        # compared against this repository's copy, which GitHub holds
        # and the web host does not. A compromised host can serve a
        # perfectly self-consistent forgery; only an independent
        # witness of the head catches that.
        #
        # The same flag also takes the signing key fingerprint from
        # api/trust.json in this repository, so this step fails when the
        # host publishes a key the repository does not know -- and when
        # the host quietly stops serving the signature at all, which is
        # a downgrade rather than an absence. CI verifies signatures and
        # cannot make them: the private key is offline on the owner
        # machine, never a repository secret (owner decision, PND-034).
        run: node scripts/verify-contract-api.mjs --expect-head-from-repo
