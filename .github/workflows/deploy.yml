name: Deploy nac-spec to yujin.app/nac-spec/

# Mirror this repo's contents into the GoDaddy public_html path that
# serves https://yujin.app/nac-spec/. The mirror previously lived
# inside the rpaforce repo (rpaforce/yujin.app/nac-spec/) and was
# removed in rpaforce commit 0ff3afa0 ("canonical lives at
# yujinapp/nac-spec"). This workflow re-establishes the deploy path
# without a duplicate copy in rpaforce.
#
# Secrets needed in this repo (Settings -> Secrets and variables ->
# Actions). Copy them from the rpaforce-crm repo secrets where the
# same values already live:
#   GODADDY_HOST     -- e.g. p3plzcpnl504099.prod.phx3.secureserver.net
#   GODADDY_USER     -- e.g. c5kfcjz0z5se
#   GODADDY_SSH_KEY  -- the full private key (PEM), no passphrase
#
# Trigger:
#   - every push to main
#   - manual via "Run workflow" on the Actions tab
#
# Implementation note: the GoDaddy cPanel shell init scripts call
# `tput` which fails on non-interactive SSH sessions when $TERM is
# empty. The default appleboy/scp-action runs an extract step that
# inherits this broken state and rolls back. We use direct rsync
# over SSH (with the runner's openssh client) and explicitly
# override TERM so the remote shell init does not blow up.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Rsync to GoDaddy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history on purpose: the published-package gate below
          # compares the npm release against what the repository
          # declared AT that version, which it finds by looking for the
          # "release(<version>)" commit. In a shallow clone there is no
          # such commit to find and the gate fails closed rather than
          # comparing against the wrong tree.
          fetch-depth: 0

      - name: Integrity gate
        # Audit N-02/N-03. A stale Subresource Integrity hash in index.html
        # must block the deploy instead of shipping a page that silently
        # refuses to run, or that tells adopters to load an unverified file.
        # Byte-level, no browser, no dependencies.
        run: node scripts/build-integrity.mjs

      - name: Integrity gate goes red when it should
        # The integrity gate shipped with zero behaviour tests, and four
        # defects were found in it by hand once someone looked: --write
        # alone refreshed an already-published frozen copy; a refused
        # freeze still rewrote index.html, leaving a hash that matched
        # nothing; the "loads from the immutable path" assertion was
        # satisfied by the prose two sections above, so the tag could
        # revert to the mutable alias (audit N-03) and still pass; and
        # the adopter-snippet check read the tag --write had just
        # re-pinned, so it could not see a stale snippet.
        # Same shape as the contract suite: one thing broken per case,
        # in a throwaway git repo, asserting the right refusal.
        run: node scripts/test-integrity-gate.mjs

      - name: Global validator lock
        # Audit N-14 (the validate_global buckets carried no code) and audit
        # N-33 (the id collector could not see a manifest written the way the
        # SPEC documents, so the validator answered ok = true without ever
        # reading the manifest). Pure node, no browser: it loads the published
        # runtime bytes in a sandbox with the smallest DOM that makes the
        # validator speak, and plants each defect back in memory to prove the
        # lock goes red on the real regression.
        run: node scripts/test-validate-global.mjs

      - name: Version coherence gate
        # Audit N-17. The published tarball once announced a version two
        # releases behind its own package.json, because the version was
        # hand-typed in a dozen files and whoever published remembered
        # eleven. This refuses a tree where any declared slot disagrees
        # with the authoritative constant in js/nac.js.
        run: node scripts/check-version-coherence.mjs

      - name: Version coherence gate goes red when it should
        # A gate nobody proved red is a decoration, and this one was the
        # last gate in the project with no behaviour tests. Writing the
        # suite found two defects in it the same hour (N-41, N-42): it
        # refused true documentation that names the shipping version, and
        # it read the authoritative version out of a COMMENT, so it went
        # green over a runtime that exported no version at all.
        run: node scripts/test-version-gate.mjs

      - name: Contract API gate
        # Audit N-04 / N-14, owner decision D-02. The contract is
        # published as static JSON under api/, one frozen directory per
        # version. This regenerates it from the runtime and refuses the
        # deploy when: the artefacts drifted from the runtime that
        # produced them, a published version was rewritten, a version
        # disappeared from the tree (the rsync below mirrors with
        # --delete-after, so that would delete it from the web), or the
        # hash chain does not recompute.
        run: node scripts/build-contract-api.mjs

      - name: Contract API gate goes red when it should
        # A gate nobody proved red is a decoration. This suite breaks
        # one thing at a time in a throwaway copy and asserts the gate
        # refuses each one for the right reason. Includes the signature
        # cases: a tampered signature, a stale one, a substituted key,
        # a retired key, a published key with no signature at all, and
        # the two ways the owner could lose control of the private key.
        run: node scripts/test-contract-api.mjs

      - name: Consumer verifier goes red when it should
        # The other half, and the half that matters to anyone who is
        # not us: the command a third party runs against a URL. Each
        # case stands up a real HTTP server over a copy of api/, serves
        # a tampered publication, and asserts the verifier refuses.
        #
        # The case worth naming: a host that rewrites an artefact,
        # rebuilds the whole chain so it recomputes, publishes a key of
        # its own and signs the forgery with it. Everything closes
        # against itself; only the independent witnesses catch it. All
        # localhost, no network.
        run: node scripts/test-contract-api-http.mjs

      - name: Published package gate
        # The other half of the delivery contract, and the half that had
        # nobody watching it: `npm install @nac3/runtime`. Version
        # coherence above reads the TREE, so it cannot see a package
        # published from a dirty copy, an older checkout or without a
        # rebuild -- which is exactly what shipped on 2026-10-24, a
        # tarball carrying the previous version's SPEC.md and a licence
        # header contradicting the LICENSE beside it.
        #
        # This fetches what an adopter actually receives and compares it
        # with this tree, file by file. Release mode: a version in the
        # tree that is not published yet passes with a notice (that is
        # the window between a bump and a publication); a version that
        # IS published and no longer matches fails.
        #
        # --witness-release is load-bearing: the contract is about what
        # the repository declared AT the published version, so the
        # witness is the release commit for it, not today's tip. Without
        # that flag this step goes red on every push that touches
        # runtime/ between releases -- observed on its own first run.
        run: node scripts/verify-npm-publication.mjs --mode release --witness-release

      - name: Published package gate goes red when it should
        # Same rule as every gate here: it has to be seen refusing. A
        # local HTTP registry serves a real tarball built from runtime/
        # and the suite breaks one thing at a time -- a changed line of
        # shipped code, the 2026-10-24 stale spec, the MIT/Apache
        # contradiction, a declared file missing, an undeclared file
        # shipped, a tin that disagrees with its contents, bytes that
        # do not match the integrity on record -- asserting each time
        # that the gate refuses AND names what it refused. The last
        # cases cover the gate's own honesty: "not published yet" is
        # not a divergence, and an unreachable registry is never a pass.
        run: node scripts/test-npm-publication-gate.mjs

      - name: Landing i18n guard
        # The landing ships in ten locales and the switcher only serves a
        # catalogue that declares itself complete. This refuses the ways that
        # promise quietly breaks: a key set that drifts from English, an empty
        # value, a declared language that contradicts the filename, markup drift
        # (a translation dropping a <code> or a <strong>), foreign scripts inside
        # a Latin-script catalogue, and a key index.html asks for that some
        # catalogue lacks. Written after the first Portuguese draft shipped two
        # Chinese characters mid-sentence and nothing would have caught it.
        #
        # A value identical to English is sometimes a real cognate. The
        # catalogue declares those in _same_as_english, and the guard fails both
        # on an undeclared match and on a declaration that no longer holds.
        run: node scripts/test-landing-i18n.mjs

      - name: Translation banner gate
        # Different surface, same promise. The nine SPEC translations are
        # machine translations of an older revision, and each page states so
        # at the top, in its own language, with the revision it came from and
        # how much of the current text it carries. The banner is GENERATED, so
        # this redraws the expected banner and compares it letter by letter:
        # a translation whose coverage moved and whose banner did not is a page
        # that lies about itself, which is the one thing these pages exist to
        # stop. Before the generator existed, the nine files were orphans from
        # May with nothing producing them.
        run: node scripts/build-translation-banners.mjs

      - name: Translation banner gate goes red when it should
        # And the proof that the gate above is not decorative: a tampered
        # banner, a missing banner, a coverage number that moved, a locale
        # declared in the wrong language. Each case asserts the gate refuses
        # it for the right reason -- two of these cases were written after the
        # first version of the gate passed green over the very defect it
        # existed to catch.
        run: node scripts/test-translations-gate.mjs

      - name: Stylesheet link gate
        # Audit N-46 / PND-053. From 2026-06-28 the docs renderer wrote
        # <link rel="stylesheet" href="/nac-spec/css/yujin-tokens.css"> into
        # every page it generated and the file was never written: 262
        # published pages -- SPEC.html, the page of the normative document,
        # among them -- asked the server for it and got a 404 on every load.
        # Nothing looked broken, because every custom property is used with
        # an inline fallback, so it failed SILENTLY in the project whose
        # argument is that it does not. Four months; the browser gate for
        # the nine translations found it by LOADING a page, not by reading.
        #
        # The defect was never the missing file: it was that a page could
        # claim a resource nobody checked existed. This refuses any page
        # whose local stylesheet -- <link> or @import -- does not resolve in
        # the tree being deployed.
        run: node scripts/check-stylesheet-links.mjs

      - name: Stylesheet link gate goes red when it should
        # A gate nobody proved red is a decoration. Twelve cases, each
        # planting one dead reference in a throwaway tree; the first is the
        # verbatim <link> line the 262 pages really shipped, and the last
        # refuses a scan that finds no page at all, because a gate that
        # measures nothing and prints OK is the failure mode this repository
        # keeps finding in its own locks.
        run: node scripts/test-stylesheet-links.mjs

      - name: Live-landing smoke check goes red when it should
        # The post-deploy smoke check below is DERIVED from this tree
        # instead of hand-typed in YAML, which is the whole point -- the
        # previous version asserted the literal markup
        # <h2>What NAC3 does not cover</h2>, the landing rewrite reworded
        # that heading, and the deploy would have uploaded the tree and
        # then gone red on a release that was otherwise correct.
        #
        # A derived check brings its own way of lying: derive nothing,
        # assert nothing, pass. This stands up a local host serving a
        # tampered copy for each regression the check claims to guard --
        # a dropped limits section, a single dropped limit, a stale
        # version badge, a rewritten SRI hash, a missing immutable path,
        # a dropped license, a dropped link back to the method, and a
        # tree that declares no ids at all -- and asserts the refusal.
        # Writing it found one defect in the check itself: it matched the
        # ids as bare substrings, and every one of them is also named in
        # the page's own manifest block, so a host that stripped the
        # markup and kept the script satisfied it.
        run: node scripts/smoke-live-landing.mjs --selftest

      - name: Stage files for upload
        # Strip junk that should never land on the live server.
        #
        # The last two are internal process documents, not product: the
        # session bootstrap (CLAUDE.md) and the working agreement it
        # loads, which carries the owner's name, how he works and the
        # decisions he has taken. Everything else under docs/ IS served
        # today at an unlinked but guessable URL (docs/ELIGIBILITY.md
        # answers 200); whether that stays that way is the owner's call
        # and is tracked as a pending item. These two are excluded
        # because they were never published, so not publishing them is
        # still a free and reversible choice -- working agreement rule
        # 17: what is published is not deleted, it is redirected.
        run: |
          rm -rf _deploy_stage
          mkdir -p _deploy_stage
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='node_modules/' \
            --exclude='_deploy_stage/' \
            --exclude='*.tsbuildinfo' \
            --exclude='*.log' \
            --exclude='IMPLEMENTATION_GUIDE.md' \
            --exclude='NPM_PUBLISH_RUNBOOK.md' \
            --exclude='PERFORMANCE_TEST_PLAN.md' \
            --exclude='PROJECT.md' \
            --exclude='PROMO_WEEK_*.md' \
            --exclude='PENDING_*.md' \
            --exclude='CLAUDE.md' \
            --exclude='WORKING_AGREEMENT.md' \
            ./ _deploy_stage/
          echo "Staged $(find _deploy_stage -type f | wc -l) files / $(du -sh _deploy_stage | cut -f1)"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GODADDY_SSH_KEY }}" > ~/.ssh/godaddy_key
          chmod 600 ~/.ssh/godaddy_key
          ssh-keyscan -t ed25519,rsa,ecdsa -H "${{ secrets.GODADDY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to GoDaddy
        # Direct rsync over SSH with an explicit TERM=dumb so the
        # remote cPanel shell init's tput call does not abort the
        # connection. -e configures the SSH command rsync invokes
        # under the hood.
        env:
          TERM: dumb
        run: |
          rsync -avz --delete-after \
            --no-times --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/godaddy_key -p 22 -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o SendEnv=TERM" \
            _deploy_stage/ \
            "${{ secrets.GODADDY_USER }}@${{ secrets.GODADDY_HOST }}:/home/${{ secrets.GODADDY_USER }}/public_html/yujin.app/nac-spec/" \
            2>&1 | tail -40

      - name: Smoke check the live site is serving this tree
        # Everything asserted here is READ from the tree being deployed:
        # the title, the version badge, each SRI src/hash pair, the
        # immutable runtime path (and that it is actually served), the
        # thirteen ids the limits section declares, the two licenses it
        # names, and the link back to Urazuke. Audits N-02/N-03 (a stale
        # SRI ships a page that silently refuses to run), N-09/N-15/N-16
        # and items 3 and 4 of the owner verification block, measured
        # where that block measures them: on the server.
        #
        # The owner's own criterion for the limits is a grep, and a grep
        # can be satisfied by an HTML comment -- so this asserts the
        # data-nac-id ATTRIBUTES the owner approved as data, which also
        # read the same in all ten locales. The browser half of the same
        # check (visible text, zero console errors) is
        # e2e/landing-limits-check.mjs, which takes the same --base and
        # stays out of CI because it needs a browser download.
        #
        # Three attempts, because a freshly rsynced tree can take a
        # moment to come out of the host cache. Only the last attempt
        # annotates.
        run: node scripts/smoke-live-landing.mjs --base https://yujin.app/nac-spec/ --retries 3

      - name: Verify the published contract API from outside
        # The producer checked itself before the upload; this checks the
        # HOST. It fetches the published chain, recomputes it, compares
        # the sha384 of the bytes the server actually sent against the
        # recorded hashes, and requires the CORS header without which a
        # browser agent cannot read any of it.
        #
        # --expect-head-from-repo is the part that matters: the head is
        # compared against this repository's copy, which GitHub holds
        # and the web host does not. A compromised host can serve a
        # perfectly self-consistent forgery; only an independent
        # witness of the head catches that.
        #
        # The same flag also takes the signing key fingerprint from
        # api/trust.json in this repository, so this step fails when the
        # host publishes a key the repository does not know -- and when
        # the host quietly stops serving the signature at all, which is
        # a downgrade rather than an absence. CI verifies signatures and
        # cannot make them: the private key is offline on the owner
        # machine, never a repository secret (owner decision, PND-034).
        run: node scripts/verify-contract-api.mjs --expect-head-from-repo
