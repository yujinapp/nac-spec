<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc</title>
<link rel="stylesheet" href="calc.css">
  <script src="nac.browser.js"></script>
</head>
<body data-nac-plugin="calc">

<main class="calc" data-nac-id="calc.region.main" data-nac-role="region">
  <div class="display" id="display" data-nac-id="calc.field.display" data-nac-role="field">0</div>
  <div class="history" id="history" data-nac-id="calc.field.history" data-nac-role="field"></div>

  <div class="pad" data-nac-id="calc.region.pad" data-nac-role="region">
    <button class="btn op clear" onclick="clearAll()" data-nac-id="calc.action.clear" data-nac-role="action" data-nac-action="clear">C</button>
    <button class="btn op back" onclick="backspace()" data-nac-id="calc.action.backspace" data-nac-role="action" data-nac-action="backspace">&larr;</button>
    <button class="btn op pct" onclick="percent()" data-nac-id="calc.action.percent" data-nac-role="action" data-nac-action="percent">%</button>
    <button class="btn op" onclick="setOp('/')" data-nac-id="calc.action.divide" data-nac-role="action" data-nac-action="divide">/</button>

    <button class="btn num" onclick="digit('7')" data-nac-id="calc.action.digit_7" data-nac-role="action" data-nac-action="digit_7">7</button>
    <button class="btn num" onclick="digit('8')" data-nac-id="calc.action.digit_8" data-nac-role="action" data-nac-action="digit_8">8</button>
    <button class="btn num" onclick="digit('9')" data-nac-id="calc.action.digit_9" data-nac-role="action" data-nac-action="digit_9">9</button>
    <button class="btn op" onclick="setOp('*')" data-nac-id="calc.action.multiply" data-nac-role="action" data-nac-action="multiply">x</button>

    <button class="btn num" onclick="digit('4')" data-nac-id="calc.action.digit_4" data-nac-role="action" data-nac-action="digit_4">4</button>
    <button class="btn num" onclick="digit('5')" data-nac-id="calc.action.digit_5" data-nac-role="action" data-nac-action="digit_5">5</button>
    <button class="btn num" onclick="digit('6')" data-nac-id="calc.action.digit_6" data-nac-role="action" data-nac-action="digit_6">6</button>
    <button class="btn op" onclick="setOp('-')" data-nac-id="calc.action.subtract" data-nac-role="action" data-nac-action="subtract">-</button>

    <button class="btn num" onclick="digit('1')" data-nac-id="calc.action.digit_1" data-nac-role="action" data-nac-action="digit_1">1</button>
    <button class="btn num" onclick="digit('2')" data-nac-id="calc.action.digit_2" data-nac-role="action" data-nac-action="digit_2">2</button>
    <button class="btn num" onclick="digit('3')" data-nac-id="calc.action.digit_3" data-nac-role="action" data-nac-action="digit_3">3</button>
    <button class="btn op" onclick="setOp('+')" data-nac-id="calc.action.add" data-nac-role="action" data-nac-action="add">+</button>

    <button class="btn num zero" onclick="digit('0')" data-nac-id="calc.action.digit_0" data-nac-role="action" data-nac-action="digit_0">0</button>
    <button class="btn num" onclick="dot()" data-nac-id="calc.action.dot" data-nac-role="action" data-nac-action="dot">.</button>
    <button class="btn equals" onclick="equals()" data-nac-id="calc.action.equals" data-nac-role="action" data-nac-action="equals">=</button>
  </div>
</main>

<script src="calc.js"></script>
<script src="nac-bridge.js"></script>
